name: Publish ClawHub skill

on:
  pull_request:
    paths:
      - skills/**
      - .github/workflows/clawhub-publish.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: clawhub-skill-publish-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v0.23.1
    with:
      root: skills
      owner: socq
      dry_run: true

  publish:
    if: github.event_name == 'workflow_dispatch'
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v0.23.1
    with:
      root: skills
      owner: socq
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
